<div>
  <h1>Api called using services</h1>
  <a routerLink="/admin">admin</a>
</div>
<router-outlet></router-outlet>

<!-- <pre>{{ users() | json }}</pre> -->

<form #userForm="ngForm" (ngSubmit)="addUser(userForm)" >
  <div>
    <input type="text" placeholder="Enter Your Name" name="name" [ngModel]="selectedUser()?.name">
  </div>
  <div>
    <input type="text" placeholder="Enter Your Age" name="age" [ngModel]="selectedUser()?.age">
  </div>
  <div>
    <input type="text" placeholder="Enter Your Email" name="email" [ngModel]="selectedUser()?.email">
  </div>
  <button class="add" >{{!selectedUser()?"Add User":"Update User"}}</button>
</form>
<hr>
@for(item of users(); track item.id) {
  <ul>
    <li><strong>Name:</strong> {{item.name}}</li>
    <li><strong>Age:</strong> {{item.age}}</li>
    <li><strong>Email:</strong> {{item.email}}</li>
    <li><button (click)="deleteUser(item.id)">delete</button> <button (click)="selectUser(item.id)">update</button></li>
  </ul>
} @empty {
  <p>Loading users or no data found...</p>
}
