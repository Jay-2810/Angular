<h1>Form Grouping in Reactive Forms</h1>
<form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <div>
        <input type="text" [(ngModel)]="username" placeholder="Enter your name" formControlName="name">
        <span style="color: red;" *ngIf="name?.hasError('required')">*</span>
        <span class="error" *ngIf="name?.invalid &&(name?.dirty || name?.touched)">please enter username</span>
    </div>
    <div>
        <input type="text" [(ngModel)]="userpassword" placeholder="Enter Password" formControlName="password">
         <span style="color: red;" *ngIf="password?.hasError('required')">*</span>
        <span class="error" *ngIf="password?.invalid &&(password?.dirty || password?.touched)">please enter valid pass</span>
    </div>
    <div>
        <input type="text" [(ngModel)]="useremail" placeholder="Enter your Email" formControlName="email">
        <span style="color: red;" *ngIf="email?.hasError('required')">*</span>
        <span class="error" *ngIf="email?.invalid &&(email?.dirty || email?.touched)">please enter valid email</span>
    </div>
    <div>
        <button>Submit</button>
        <button type="button" (click)="setValue()">Set val</button>
        <button type="reset" (click)="resetValue()">Reset</button>
    </div>
</form>
